name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Make sure no private data is tracked
        run: test -z "$(git ls-files 'data/private' '*.xlsx' '*.xls')"
      - name: Run tests
        run: pytest -q
      - name: Run the analysis on simulated data (smaller run)
        run: python src/run_all.py --sims 2000
